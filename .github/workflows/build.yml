name: Build Queendom Godot Android (C# Silk)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build .NET Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Android Workload
        run: |
          dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Restore NuGet Packages
        run: |
          dotnet restore platform/android/AndroidCsharp/AndroidCsharp.csproj -p:CheckEolTargetFramework=false

      - name: Build and Package APK
        run: |
          dotnet publish platform/android/AndroidCsharp/AndroidCsharp.csproj \
            -c Release \
            -p:CheckEolTargetFramework=false \
            -p:AndroidPackageFormat=apk \
            -p:AndroidEnablePreloadAssemblies=true \
            -p:EmbedAssembliesIntoApk=true

      - name: Locate Output APK
        id: find_apk
        run: |
          APK_PATH=$(find platform/android/AndroidCsharp -type f -name "*Signed.apk" -o -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueendomGodot-Editor-Csharp-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
