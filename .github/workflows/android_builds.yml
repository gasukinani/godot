name: Build Android (Godot 4.3 Mono / C#)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target_type:
        description: 'Target Build (editor o template_release)'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - template_release
      arch_type:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-mono:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout Custom Repo
      - name: Checkout Custom Repository
        uses: actions/checkout@v4
        with:
          path: 'custom_repo'

      # 2. Checkout Official Godot 4.3-stable
      - name: Checkout Official Godot 4.3-stable
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot'
          ref: '4.3-stable'
          path: 'godot_src'
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons & Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq scons pkg-config yasm unzip curl zip
          python3 -m pip install --upgrade pip
          pip3 install scons

      - name: Locate & Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-scons-godot-4-3-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scons-godot-4-3-

      # 3. Kopyahin ang Custom Mono files at Headers
      - name: Apply Custom Android Mono Patches
        run: |
          echo "Injecting custom mono files into Godot 4.3-stable tree..."
          
          # Headers para sa mono delegates
          mkdir -p godot_src/modules/mono/thirdparty
          if [ -d "custom_repo/modules/mono/thirdparty" ]; then
            cp -fv custom_repo/modules/mono/thirdparty/* godot_src/modules/mono/thirdparty/
          fi

          # Custom gd_mono.cpp
          cp -fv custom_repo/modules/mono/mono_gd/gd_mono.cpp godot_src/modules/mono/mono_gd/gd_mono.cpp

          # Custom mono_configure.py
          if [ -f "custom_repo/modules/mono/build_scripts/mono_configure.py" ]; then
            cp -fv custom_repo/modules/mono/build_scripts/mono_configure.py godot_src/modules/mono/build_scripts/mono_configure.py
          fi

          # Siguraduhing walang scons_hints line na makakasira sa SCons
          find godot_src/modules/mono -name "SCsub*" -o -name "*.py" | xargs sed -i '/scons_hints/d' || true

      # 4. Instant Glue Generation (10 Segundo lang!)
      - name: Instant Mono Glue Extraction
        run: |
          cd godot_src
          echo "Downloading official 4.3 binary for glue extraction..."
          curl -L -o godot_mono.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip"
          unzip -q godot_mono.zip
          
          OFFICIAL_BIN=$(find . -maxdepth 2 -name "Godot_v4.3-stable_mono_linux.x86_64" | head -n 1)
          chmod +x "$OFFICIAL_BIN"
          
          "$OFFICIAL_BIN" --headless --generate-mono-glue modules/mono/glue
          rm -f godot_mono.zip "$OFFICIAL_BIN"

      # 5. Mabilis na SCons Compile gamit ang Cache + debug_symbols=no
      - name: Build Android Native Libraries (SCons)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
          SCONS_CACHE_LIMIT: 8192
        run: |
          cd godot_src
          TARGET="${{ inputs.target_type || 'editor' }}"
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          echo "Building Godot 4.3 Android for target: $TARGET, arch: $ARCH..."
          
          scons platform=android \
            target=$TARGET \
            arch=$ARCH \
            module_mono_enabled=yes \
            debug_symbols=no \
            scons_cache=$SCONS_CACHE \
            -j$(nproc)

      # 6. Build Managed Assemblies
      - name: Build C# Managed Assemblies
        run: |
          cd godot_src
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin

      # 7. Inject .NET 8 Runtime (.so files)
      - name: Inject .NET 8 Runtime Libraries
        run: |
          cd godot_src
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Mono Runtime for $DOTNET_RID..."
          curl -L -o mono_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8"
          unzip -q mono_pack.zip -d mono_extracted

          TARGET_DIRS=(
            "bin"
            "platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/lib/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/app/src/main/jniLibs/${ANDROID_ABI}"
          )

          for dir in "${TARGET_DIRS[@]}"; do
            mkdir -p "$dir"
          done

          find mono_extracted/ -name "*.so" | while read so_file; do
            for dir in "${TARGET_DIRS[@]}"; do
              cp -v "$so_file" "$dir/"
            done
          done

      # 8. Package APK gamit ang Gradle
      - name: Package Android APK
        run: |
          cd godot_src/platform/android/java
          chmod +x ./gradlew

          TARGET="${{ inputs.target_type || 'editor' }}"
          if [ "$TARGET" = "editor" ]; then
            echo "Packaging Godot 4.3 Android Editor APK..."
            ./gradlew generateGodotEditor --stacktrace
          else
            echo "Packaging Godot 4.3 Android Template APK..."
            ./gradlew generateGodotTemplates --stacktrace
          fi

      # 9. Upload APK Output
      - name: Upload Godot 4.3 Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.3-android-mono-apk
          path: godot_src/bin/**/*.apk
          if-no-files-found: error
