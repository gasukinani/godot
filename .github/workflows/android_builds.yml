name: Build Godot 4.3.0-stable Android Editor with C#

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      arch_type:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-mono:
    runs-on: ubuntu-22.04

    steps:
      # 1. I-checkout ang repository mo kung nasaan ang custom gd_mono.cpp mo
      - name: Checkout Custom Patches
        uses: actions/checkout@v4
        with:
          path: 'custom_patches'

      # 2. I-checkout ang Opisyal na Godot 4.3-stable Source Code (1648 interop count)
      - name: Checkout Official Godot 4.3-stable
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot'
          ref: '4.3-stable'
          path: 'godot_src'
          submodules: recursive

      # 3. I-apply ang custom gd_mono.cpp at mono_configure.py bypass
      - name: Apply Custom Android Mono Patches
        run: |
          echo "Injecting custom gd_mono.cpp into Godot 4.3-stable..."
          # Hanapin at kopyahin ang gd_mono.cpp mula sa custom_patches
          find custom_patches/ -name "gd_mono.cpp" -exec cp -fv {} godot_src/modules/mono/mono_gd/gd_mono.cpp \;
          
          # Kung may mono_delegates.h, kopyahin din
          find custom_patches/ -name "mono_delegates.h" -exec cp -fv {} godot_src/modules/mono/thirdparty/ \; || true

          # I-bypass ang platform check sa mono_configure.py para tanggapin ang Android
          sed -i 's/return is_desktop(platform)/return is_desktop(platform) or platform == "android"/g' godot_src/modules/mono/build_scripts/mono_configure.py
          sed -i 's/if not module_supports_tools_on(env\["platform"\]):/if env\["platform"\] not in \["windows", "macos", "linuxbsd", "android"\]:/g' godot_src/modules/mono/build_scripts/mono_configure.py

      # 4. I-set up ang mga Kinakailangang SDKs at Tools
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config yasm unzip curl zip
          pip install scons

      - name: Locate & Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      # 5. SCons Cache para sa mabilis na "Retrieved from cache"
      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-godot-4-3-stable-${{ inputs.arch_type || 'arm64' }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-godot-4-3-stable-${{ inputs.arch_type || 'arm64' }}-
            ${{ runner.os }}-godot-4-3-stable-
          save-always: true

      # 6. I-compile ang Godot 4.3 Native Libraries (Fast + Cache Mode)
      - name: Build Android Native Libraries (SCons Fast + Cache Mode)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
          SCONS_CACHE_LIMIT: 8192
        run: |
          cd godot_src
          ARCH="${{ inputs.arch_type }}"
          ARCH="${ARCH:-arm64}"
          
          echo "Building Godot 4.3-stable Android Editor ($ARCH)..."
          
          scons platform=android \
            target=editor \
            arch=$ARCH \
            module_mono_enabled=yes \
            scons_cache=$SCONS_CACHE \
            scons_cache_limit=$SCONS_CACHE_LIMIT \
            scu_build=yes \
            debug_symbols=no \
            fast_unsafe=yes \
            ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -j$(nproc)

      # 7. I-bundle ang .NET 8 Runtime + BCL + Opisyal na Godot 4.3 DLLs
      - name: Prepare .NET Runtime & GodotSharp Assemblies
        run: |
          ARCH="${{ inputs.arch_type }}"
          ARCH="${ARCH:-arm64}"
          mkdir -p mono_device_payload/assemblies

          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Mono runtime for $DOTNET_RID..."
          curl -L -o mono_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8"
          unzip -q mono_pack.zip -d mono_extracted

          # Kopyahin ang .so papunta sa Gradle JNI directory para ma-package sa APK
          TARGET_DIRS=(
            "godot_src/platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}"
            "godot_src/platform/android/java/lib/src/main/jniLibs/${ANDROID_ABI}"
          )
          for dir in "${TARGET_DIRS[@]}"; do
            mkdir -p "$dir"
            find mono_extracted/ -name "*.so" -exec cp -v {} "$dir/" \;
          done

          # Kopyahin din ang .so at BCL (.dll files) para sa device storage payload
          find mono_extracted/ -name "*.so" -exec cp -v {} mono_device_payload/ \;
          find mono_extracted/ -name "*.dll" -exec cp -v {} mono_device_payload/assemblies/ \;

          # Kunin ang opisyal na 4.3-stable GodotSharp DLLs (tugma sa 1648 interop count)
          echo "Downloading official Godot 4.3-stable Mono assemblies..."
          curl -L -o godot_mono_linux.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip"
          unzip -q godot_mono_linux.zip -d godot_mono_linux
          
          cp -rv godot_mono_linux/*/GodotSharp/Api/Debug/*.dll mono_device_payload/assemblies/ || true
          cp -rv godot_mono_linux/*/GodotSharp/Tools/*.dll mono_device_payload/assemblies/ || true

          # I-zip ang buong payload na ilalagay sa /storage/emulated/0/mono/
          cd mono_device_payload
          zip -r ../mono_storage_payload.zip ./*
          cd ..

      # 8. I-package ang Android APK gamit ang Gradle
      - name: Package Android APK
        run: |
          cd godot_src/platform/android/java
          chmod +x ./gradlew
          ./gradlew generateGodotEditor --stacktrace

      # 9. I-upload ang APK at ang Storage Payload
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.3-android-mono-bundle
          if-no-files-found: warn
          path: |
            godot_src/bin/*.apk
            godot_src/platform/android/java/editor/build/outputs/apk/**/*.apk
            mono_storage_payload.zip
