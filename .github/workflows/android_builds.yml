name: Build Android (Godot 4.3-stable Mono / C#)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target_type:
        description: 'Target Build (editor o template_release)'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - template_release
      arch_type:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-mono:
    runs-on: ubuntu-22.04

    steps:
      # 1. Kuhanin ang custom repo mo (para makuha ang gd_mono.cpp)
      - name: Checkout Custom Repository
        uses: actions/checkout@v4
        with:
          path: 'custom_repo'

      # 2. Kuhanin ang opisyal na Godot 4.3-stable Source Code
      - name: Checkout Official Godot 4.3-stable
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot'
          ref: '4.3-stable'
          path: 'godot_src'
          submodules: recursive

      # 3. I-bypass ang harang sa mono_configure.py at i-apply ang gd_mono.cpp
      - name: Patch Godot 4.3 for Android Mono Editor Support
        run: |
          echo "Bypassing editor platform check in mono_configure.py..."
          sed -i 's/raise RuntimeError("This module does not currently support building for this platform for editor builds.")/pass/' godot_src/modules/mono/build_scripts/mono_configure.py

          echo "Injecting custom gd_mono.cpp..."
          cp -fv custom_repo/modules/mono/mono_gd/gd_mono.cpp godot_src/modules/mono/mono_gd/gd_mono.cpp

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config yasm unzip curl zip
          python -m pip install --upgrade pip
          pip install scons

      - name: Locate & Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-scons-godot-4-3-stable-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scons-godot-4-3-stable-${{ github.ref }}-
            ${{ runner.os }}-scons-godot-4-3-stable-
          save-always: true

      # 4. I-compile ang Godot 4.3-stable Android Native Libraries
      - name: Build Android Native Libraries (SCons)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
          SCONS_CACHE_LIMIT: 8192
        run: |
          cd godot_src
          TARGET="${{ inputs.target_type || 'editor' }}"
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          echo "Building Godot 4.3-stable Android for target: $TARGET, arch: $ARCH..."
          
          scons platform=android \
            target=$TARGET \
            arch=$ARCH \
            module_mono_enabled=yes \
            scons_cache=$SCONS_CACHE \
            -j$(nproc)

      # 5. Inject .NET 8 Runtime (.so files)
      - name: Inject .NET 8 Runtime Libraries
        run: |
          cd godot_src
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Mono Runtime for $DOTNET_RID..."
          curl -L -o mono_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8" || true
          unzip -q mono_pack.zip -d mono_extracted || true

          TARGET_DIRS=(
            "bin"
            "platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/lib/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/app/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/editor/libs/${ANDROID_ABI}"
            "platform/android/java/lib/libs/${ANDROID_ABI}"
          )

          for dir in "${TARGET_DIRS[@]}"; do
            mkdir -p "$dir"
          done

          echo "Copying runtime shared libraries (.so)..."
          find mono_extracted/ -name "*.so" | while read so_file; do
            for dir in "${TARGET_DIRS[@]}"; do
              cp -v "$so_file" "$dir/"
            done
          done

      # 6. Package APK gamit ang Gradle
      - name: Package Android APK
        run: |
          cd godot_src/platform/android/java
          chmod +x ./gradlew

          TARGET="${{ inputs.target_type || 'editor' }}"
          if [ "$TARGET" = "editor" ]; then
            echo "Packaging Godot 4.3-stable Android Editor APK..."
            ./gradlew generateGodotEditor --stacktrace
          else
            echo "Packaging Godot 4.3-stable Android Template APK..."
            ./gradlew generateGodotTemplates --stacktrace
          fi

      # 7. Upload Artifact
      - name: Collect and Upload Output APK
        run: |
          mkdir -p build_output/apk/
          find godot_src/bin/ godot_src/platform/android/java -name "*.apk" -exec cp -v {} build_output/apk/ \;
          echo "Output APKs:"
          ls -la build_output/apk/

      - name: Upload Godot 4.3 Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.3-android-mono-apk
          path: build_output/apk/*.apk
          if-no-files-found: error
