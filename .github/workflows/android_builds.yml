name: Build Godot 4.3 Android Editor with C#

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      arch_type:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-mono:
    runs-on: ubuntu-22.04

    steps:
      # 1. Diretso nang i-checkout ang iyong repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Linisin ang scons_hints at i-patch ang permissions sa sarili mong repo
      - name: Prepare Scripts and Android Permissions
        run: |
          echo "Cleaning any scons_hints imports..."
          find modules/mono -type f \( -name "SCsub" -o -name "*.py" \) -exec sed -i '/scons_hints/d' {} + || true

          echo "Ensuring mono_configure.py allows Android editor..."
          sed -i 's/return is_desktop(platform)/return is_desktop(platform) or platform == "android"/g' modules/mono/build_scripts/mono_configure.py || true
          sed -i 's/if not module_supports_tools_on(env\["platform"\]):/if env\["platform"\] not in \["windows", "macos", "linuxbsd", "android"\]:/g' modules/mono/build_scripts/mono_configure.py || true

          echo "Patching AndroidManifest.xml for storage permissions..."
          find platform/android/java -name "AndroidManifest.xml" | while read -r manifest; do
            if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$manifest"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' "$manifest"
            fi
            if ! grep -q "READ_EXTERNAL_STORAGE" "$manifest"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' "$manifest"
            fi
            if ! grep -q "WRITE_EXTERNAL_STORAGE" "$manifest"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$manifest"
            fi
          done

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config yasm unzip curl zip
          pip install scons

      - name: Locate & Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      # 3. I-compile ang Android Editor Native Library
      - name: Build Android Native Libraries (SCons)
        run: |
          ARCH="${{ inputs.arch_type }}"
          ARCH="${ARCH:-arm64}"
          
          echo "Building Godot Editor for Android ($ARCH)..."
          scons platform=android \
            target=editor \
            arch=$ARCH \
            module_mono_enabled=yes \
            ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -j$(nproc)

      # 4. I-download at i-bundle ang .NET 8 Runtime + BCL Assemblies
      - name: Prepare .NET Runtime & GodotSharp Assemblies
        run: |
          ARCH="${{ inputs.arch_type }}"
          ARCH="${ARCH:-arm64}"
          mkdir -p mono_device_payload/assemblies

          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Mono runtime for $DOTNET_RID..."
          curl -L -o mono_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8"
          unzip -q mono_pack.zip -d mono_extracted

          # Kopyahin ang .so papunta sa Gradle JNI directory para ma-bundle sa loob ng APK
          TARGET_DIRS=(
            "platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/lib/src/main/jniLibs/${ANDROID_ABI}"
          )
          for dir in "${TARGET_DIRS[@]}"; do
            mkdir -p "$dir"
            find mono_extracted/ -name "*.so" -exec cp -v {} "$dir/" \;
          done

          # Kopyahin din ang .so at BCL (.dll files) para sa device storage payload
          find mono_extracted/ -name "*.so" -exec cp -v {} mono_device_payload/ \;
          find mono_extracted/ -name "*.dll" -exec cp -v {} mono_device_payload/assemblies/ \;

          # Kunin ang official GodotSharp assemblies
          echo "Downloading official Godot 4.3-stable Mono tools..."
          curl -L -o godot_mono_linux.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip"
          unzip -q godot_mono_linux.zip -d godot_mono_linux
          
          cp -rv godot_mono_linux/*/GodotSharp/Api/Debug/*.dll mono_device_payload/assemblies/ || true
          cp -rv godot_mono_linux/*/GodotSharp/Tools/*.dll mono_device_payload/assemblies/ || true

          # I-zip ang buong payload na ilalagay sa /storage/emulated/0/mono/
          cd mono_device_payload
          zip -r ../mono_storage_payload.zip ./*
          cd ..

      # 5. I-package ang Android APK gamit ang Gradle
      - name: Package Android APK
        run: |
          cd platform/android/java
          chmod +x ./gradlew
          ./gradlew generateGodotEditor --stacktrace

      # 6. I-upload ang APK at Storage Payload
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.3-android-mono-bundle
          if-no-files-found: warn
          path: |
            bin/*.apk
            platform/android/java/editor/build/outputs/apk/**/*.apk
            mono_storage_payload.zip
