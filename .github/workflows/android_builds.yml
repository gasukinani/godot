name: Build Android (Mono / C# Enabled)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target_type:
        description: 'Target Build (editor o template_release)'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - template_release
      arch_type:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-mono:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev \
            libpulse-dev libudev-dev libxi-dev yasm unzip curl
          python -m pip install --upgrade pip
          pip install scons

      - name: Locate & Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-scons-android-mono-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scons-android-mono-${{ github.ref }}-
            ${{ runner.os }}-scons-android-mono-
          save-always: true

      - name: Build Android Native Libraries (SCons)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
          SCONS_CACHE_LIMIT: 8192
        run: |
          TARGET="${{ inputs.target_type || 'editor' }}"
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          echo "Building Godot Android for target: $TARGET, arch: $ARCH..."
          
          scons platform=android \
            target=$TARGET \
            arch=$ARCH \
            module_mono_enabled=yes \
            scons_cache=$SCONS_CACHE \
            -j$(nproc)

      - name: Download & Inject Microsoft .NET Android Runtime (Mono)
        run: |
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          # Tukuyin ang NuGet Runtime Identifier (RID) at Android ABI
          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Runtime package for $DOTNET_RID..."
          NUGET_URL="https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8"
          curl -L -o mono_runtime.zip "$NUGET_URL"
          unzip -q mono_runtime.zip -d mono_extracted

          # 1. Ilagay ang libmonosgen-2.0.so sa Gradle jniLibs para ma-embed sa APK
          JNILIBS_DIR="platform/android/java/app/src/main/jniLibs/${ANDROID_ABI}"
          mkdir -p "$JNILIBS_DIR"
          cp -v mono_extracted/runtimes/${DOTNET_RID}/native/libmonosgen-2.0.so "$JNILIBS_DIR/"

          # Kopyahin din sa app/libs para sigurado sa compatibility ng Gradle
          mkdir -p "platform/android/java/app/libs/${ANDROID_ABI}"
          cp -v mono_extracted/runtimes/${DOTNET_RID}/native/libmonosgen-2.0.so "platform/android/java/app/libs/${ANDROID_ABI}/"

          # 2. Ihanda ang Mono runtime bundle folder para sa artifact
          mkdir -p build_output/mono_bundle/mono/assemblies/
          cp -v mono_extracted/runtimes/${DOTNET_RID}/native/libmonosgen-2.0.so build_output/mono_bundle/mono/
          cp -v mono_extracted/runtimes/${DOTNET_RID}/lib/net8.0/*.dll build_output/mono_bundle/mono/assemblies/

          # Isama rin ang assemblies sa app assets ng APK
          mkdir -p platform/android/java/app/src/main/assets/mono/assemblies/
          cp -v mono_extracted/runtimes/${DOTNET_RID}/lib/net8.0/*.dll platform/android/java/app/src/main/assets/mono/assemblies/

          echo ".NET Runtime successfully integrated into Gradle project!"

      - name: Package Android APK (Official Godot Gradle Task)
        run: |
          TARGET="${{ inputs.target_type || 'editor' }}"
          cd platform/android/java
          chmod +x ./gradlew

          if [ "$TARGET" = "editor" ]; then
            echo "Packaging Godot Android Editor APK..."
            ./gradlew generateGodotEditor --stacktrace
          else
            echo "Packaging Godot Android Export Template APK..."
            ./gradlew generateGodotTemplates --stacktrace
          fi

      - name: Copy & Organize Outputs
        run: |
          mkdir -p build_output/apk/
          
          # Hanapin at kopyahin ang APKs
          find bin/ platform/android/java -name "*.apk" -exec cp -v {} build_output/apk/ \;
          
          # I-archive ang mono folder para madaling i-download at i-extract sa phone
          cd build_output/mono_bundle
          zip -r ../mono_phone_storage.zip mono/
          cd ../..
          rm -rf build_output/mono_bundle

          echo "Nilalaman ng build_output:"
          ls -la build_output/
          ls -la build_output/apk/

      - name: Upload Godot Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-mono-apk
          path: build_output/apk/*.apk
          if-no-files-found: error

      - name: Upload Phone Mono Storage Bundle (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: mono-phone-storage
          path: build_output/mono_phone_storage.zip
          if-no-files-found: warn
