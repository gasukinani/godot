name: Android Mono / .NET Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-mono:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev libxi-dev

      - name: Download & Extract Prebuilt Mono/CoreCLR Runtimes
        run: |
          # Gumawa ng directory para sa thirdparty runtime artifacts
          mkdir -p bin/mono_bundle
          
          # Halimbawa: I-download ang official prebuilt Mono Android bundle o .NET Android runtime packs
          # Pwede mong palitan ang URL ng specific release tarball mo:
          echo "Preparing Mono Android runtime dependencies..."
          
          # Halimbawa kung may custom prebuilt release tarball ka:
          # curl -L -o mono_android.tar.gz "https://github.com/godotengine/godot-mono-builds/releases/download/.../mono_android.tar.gz"
          # tar -xzf mono_android.tar.gz -C bin/mono_bundle/

      - name: Compile Godot Android with Mono Module
        run: |
          scons platform=android target=template_release arch=arm64 module_mono_enabled=yes -j$(nproc)
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-mono
          path: bin/*android*
