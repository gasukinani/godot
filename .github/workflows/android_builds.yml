name: Build Android (Mono / C# Enabled)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target_type:
        description: 'Target Build (editor o template_release)'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - template_release
      arch_type:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-mono:
    runs-on: ubuntu-22.04

    steps:
      # 1. I-checkout ang sarili mong repo (nandito ang working patches mo)
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config yasm unzip curl zip
          python -m pip install --upgrade pip
          pip install scons

      - name: Locate & Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-scons-android-mono-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scons-android-mono-${{ github.ref }}-
            ${{ runner.os }}-scons-android-mono-
          save-always: true

      # 2. I-compile ang Android Native Libraries gamit ang sarili mong patches
      - name: Build Android Native Libraries (SCons)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
          SCONS_CACHE_LIMIT: 8192
        run: |
          TARGET="${{ inputs.target_type || 'editor' }}"
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          echo "Building Godot Android for target: $TARGET, arch: $ARCH..."
          
          scons platform=android \
            target=$TARGET \
            arch=$ARCH \
            module_mono_enabled=yes \
            scons_cache=$SCONS_CACHE \
            -j$(nproc)

      # 3. I-compile ang GodotSharp & GodotPlugins DLLs (Para tugma ang Hash!)
      - name: Build Matching Godot Managed Assemblies
        run: |
          echo "Building matching GodotSharp & GodotPlugins DLLs..."
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=bin --precision=single || true

      # 4. Download Mono Runtime Pack at I-bundle ang DLLs
      - name: Inject .NET 8 Runtime & Assemblies
        run: |
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Mono Runtime for $DOTNET_RID..."
          curl -L -o mono_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8" || true
          unzip -q mono_pack.zip -d mono_extracted || true

          TARGET_DIRS=(
            "bin"
            "platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/lib/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/app/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/editor/libs/${ANDROID_ABI}"
            "platform/android/java/lib/libs/${ANDROID_ABI}"
            "build_output/mono_bundle/mono"
            "build_output/libs/${ANDROID_ABI}"
          )

          for dir in "${TARGET_DIRS[@]}"; do
            mkdir -p "$dir"
          done

          echo "Copying runtime shared libraries (.so)..."
          find mono_extracted/ -name "*.so" | while read so_file; do
            for dir in "${TARGET_DIRS[@]}"; do
              cp -v "$so_file" "$dir/"
            done
          done

          ASSETS_DIR="platform/android/java/editor/src/main/assets/mono/assemblies"
          PHONE_STORAGE="build_output/mono_bundle/mono/assemblies"
          mkdir -p "$ASSETS_DIR"
          mkdir -p "$PHONE_STORAGE"

          # Kopyahin ang .NET BCL DLLs
          find mono_extracted/ -name "*.dll" | while read dll_file; do
            cp "$dll_file" "$ASSETS_DIR/"
            cp "$dll_file" "$PHONE_STORAGE/"
          done

          # Kopyahin ang bagong compile na Godot DLLs (kung nabuo)
          if [ -d "bin/GodotSharp" ]; then
            echo "Copying freshly built GodotSharp assemblies..."
            find bin/GodotSharp/ -name "*.dll" -exec cp -v {} "$ASSETS_DIR/" \;
            find bin/GodotSharp/ -name "*.dll" -exec cp -v {} "$PHONE_STORAGE/" \;
            find bin/GodotSharp/ -name "*.runtimeconfig.json" -exec cp -v {} "$ASSETS_DIR/" \;
            find bin/GodotSharp/ -name "*.runtimeconfig.json" -exec cp -v {} "$PHONE_STORAGE/" \;
          fi

      # 5. Package APK
      - name: Package Android APK
        run: |
          cd platform/android/java
          chmod +x ./gradlew

          TARGET="${{ inputs.target_type || 'editor' }}"
          if [ "$TARGET" = "editor" ]; then
            echo "Packaging Godot Android Editor APK..."
            ./gradlew generateGodotEditor --stacktrace
          else
            echo "Packaging Godot Android Export Template APK..."
            ./gradlew generateGodotTemplates --stacktrace
          fi

      # 6. Collect Outputs (APK + Bagong Assemblies Zip)
      - name: Copy & Organize Outputs
        run: |
          mkdir -p build_output/apk/
          find bin/ platform/android/java -name "*.apk" -exec cp -v {} build_output/apk/ \;
          
          cd build_output/mono_bundle
          zip -r ../mono_phone_storage.zip mono/
          cd ../..
          rm -rf build_output/mono_bundle

      - name: Upload Godot Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-mono-apk
          path: build_output/apk/*.apk
          if-no-files-found: error

      - name: Upload Matched Mono Phone Storage Bundle (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: mono-phone-storage
          path: build_output/mono_phone_storage.zip
          if-no-files-found: warn
