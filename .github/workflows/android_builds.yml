name: Fast Build Godot 4.3 Android Editor (Mono / C#)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      arch_type:
        description: 'Android Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-editor:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repos
      - name: Checkout Custom Repository
        uses: actions/checkout@v4
        with:
          path: 'custom_repo'

      - name: Checkout Official Godot 4.3-stable
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot'
          ref: '4.3-stable'
          path: 'godot_src'
          submodules: recursive

      # 2. Setup Environment
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq scons pkg-config yasm unzip curl
          python3 -m pip install --upgrade pip
          pip3 install scons

      - name: Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      # 3. SCons Cache para mabilis ang re-builds
      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-scons-godot43-android-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scons-godot43-android-

      # 4. Kopyahin ang LAHAT ng custom Mono files mula sa iyong repo
      - name: Patch Mono for Android Editor
        run: |
          echo "Copying entire custom modules/mono (including thirdparty/mono_delegates.h)..."
          cp -rfv custom_repo/modules/mono/* godot_src/modules/mono/

          echo "Ensuring mono_configure.py allows android editor..."
          sed -i 's/def module_supports_tools_on(platform):/def module_supports_tools_on(platform):\n    if platform == "android": return True/' godot_src/modules/mono/build_scripts/mono_configure.py
          sed -i 's/"windows", "macos", "linuxbsd"/"windows", "macos", "linuxbsd", "android"/g' godot_src/modules/mono/build_scripts/mono_configure.py

      # 5. INSTANT GLUE GENERATION (10 seconds lang gamit ang official binary!)
      - name: Generate Mono Glue (Instant via Official Binary)
        run: |
          cd godot_src
          echo "Downloading official Godot 4.3 Mono Linux binary..."
          curl -L -o godot_mono.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip"
          unzip -q godot_mono.zip
          
          OFFICIAL_BIN=$(find . -maxdepth 2 -name "Godot_v4.3-stable_mono_linux.x86_64" | head -n 1)
          chmod +x "$OFFICIAL_BIN"
          
          echo "Extracting exact matching 4.3 Glue..."
          "$OFFICIAL_BIN" --headless --generate-mono-glue modules/mono/glue
          rm -f godot_mono.zip

      # 6. Compile Android Native Libraries
      - name: Build Android Native Libraries (SCons)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
          SCONS_CACHE_LIMIT: 8192
        run: |
          cd godot_src
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          echo "Compiling Godot 4.3 Android Editor for $ARCH..."
          
          scons platform=android \
            target=editor \
            arch=$ARCH \
            module_mono_enabled=yes \
            scons_cache=$SCONS_CACHE \
            -j$(nproc)

      # 7. Build C# Assemblies
      - name: Build C# Managed Assemblies
        run: |
          cd godot_src
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin

      # 8. Inject .NET 8 Runtime para sa Android
      - name: Inject .NET 8 Runtime Libraries
        run: |
          cd godot_src
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Runtime for $DOTNET_RID..."
          curl -L -o mono_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8"
          unzip -q mono_pack.zip -d mono_extracted

          mkdir -p platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}
          find mono_extracted/ -name "*.so" -exec cp -v {} "platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}/" \;

      # 9. Package APK gamit ang Gradle
      - name: Package Android APK
        run: |
          cd godot_src/platform/android/java
          chmod +x ./gradlew
          echo "Packaging APK..."
          ./gradlew generateGodotEditor --stacktrace

      # 10. Upload Final APK
      - name: Upload Godot Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.3-android-editor-mono
          path: godot_src/bin/**/*.apk
          if-no-files-found: error
