 name: Build Android (Mono / C# Enabled)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target_type:
        description: 'Target Build (editor o template_release)'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - template_release
      arch_type:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

jobs:
  build-android-mono:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev \
            libpulse-dev libudev-dev libxi-dev yasm unzip curl zip
          python -m pip install --upgrade pip
          pip install scons

      - name: Locate & Configure Android NDK
        run: |
          ANDROID_NDK_LATEST=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found Android NDK at: $ANDROID_NDK_LATEST"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST" >> $GITHUB_ENV

      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-scons-android-mono-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scons-android-mono-${{ github.ref }}-
            ${{ runner.os }}-scons-android-mono-
          save-always: true

      # STEP 1: I-build muna ang host Linux headless engine para mag-generate ng eksaktong C# glue
      - name: Build Linux Headless Engine for Glue Generation
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
        run: |
          echo "Building Linux headless editor to generate matching GodotSharp glue..."
          scons platform=linuxbsd target=editor module_mono_enabled=yes dev_build=no -j$(nproc)

          LINUX_BIN=$(find bin/ -name "godot.linuxbsd.editor*" -type f | head -n 1)
          chmod +x "$LINUX_BIN"
          
          echo "Generating GodotSharp glue using $LINUX_BIN..."
          "$LINUX_BIN" --headless --generate-godot-sharp-glue modules/mono/glue

      # STEP 2: I-compile ang C# Managed Assemblies (GodotSharp.dll, GodotPlugins.dll, atbp.)
      - name: Build GodotSharp & GodotPlugins Assemblies
        run: |
          echo "Building managed GodotSharp and GodotPlugins assemblies..."
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=bin --precision=single

          echo "Nabuong Godot assemblies:"
          ls -la bin/GodotSharp/Api/Debug/ || true
          ls -la bin/GodotSharp/Tools/ || true

      # STEP 3: I-compile ang Android Native C++ Libraries
      - name: Build Android Native Libraries (SCons)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
          SCONS_CACHE_LIMIT: 8192
        run: |
          TARGET="${{ inputs.target_type || 'editor' }}"
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          echo "Building Godot Android for target: $TARGET, arch: $ARCH..."
          
          scons platform=android \
            target=$TARGET \
            arch=$ARCH \
            module_mono_enabled=yes \
            scons_cache=$SCONS_CACHE \
            -j$(nproc)

      # STEP 4: Kunin ang .NET Runtimes at I-bundle kasama ang GodotSharp Assemblies
      - name: Inject Runtimes & Godot Assemblies into APK and Bundle
        run: |
          ARCH="${{ inputs.arch_type || 'arm64' }}"
          
          if [ "$ARCH" = "arm64" ]; then
            DOTNET_RID="android-arm64"
            ANDROID_ABI="arm64-v8a"
          elif [ "$ARCH" = "arm32" ]; then
            DOTNET_RID="android-arm"
            ANDROID_ABI="armeabi-v7a"
          elif [ "$ARCH" = "x86_64" ]; then
            DOTNET_RID="android-x64"
            ANDROID_ABI="x86_64"
          fi

          echo "Downloading .NET 8 Runtime packs for $DOTNET_RID..."

          # 1. Download Mono Runtime Pack (.so + BCL)
          curl -L -o mono_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.${DOTNET_RID}/8.0.8" || true
          unzip -q mono_pack.zip -d mono_extracted || true

          # 2. Download CoreCLR Runtime Pack (.so)
          curl -L -o coreclr_pack.zip "https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.${DOTNET_RID}/8.0.8" || true
          unzip -q coreclr_pack.zip -d coreclr_extracted || true

          # Target directories
          TARGET_DIRS=(
            "bin"
            "platform/android/java/editor/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/lib/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/app/src/main/jniLibs/${ANDROID_ABI}"
            "platform/android/java/editor/libs/${ANDROID_ABI}"
            "platform/android/java/lib/libs/${ANDROID_ABI}"
            "build_output/mono_bundle/mono"
            "build_output/libs/${ANDROID_ABI}"
          )

          for dir in "${TARGET_DIRS[@]}"; do
            mkdir -p "$dir"
          done

          # Kopyahin lahat ng native .so files
          echo "Copying runtime shared libraries (.so)..."
          find mono_extracted/ coreclr_extracted/ -name "*.so" | while read so_file; do
            for dir in "${TARGET_DIRS[@]}"; do
              cp -v "$so_file" "$dir/"
            done
          done

          # Target asset & storage paths
          ASSETS_DIR="platform/android/java/editor/src/main/assets/mono/assemblies"
          PHONE_STORAGE="build_output/mono_bundle/mono"
          mkdir -p "$ASSETS_DIR"
          mkdir -p "$PHONE_STORAGE/assemblies"
          mkdir -p "$PHONE_STORAGE/GodotSharp/Api/Debug"
          mkdir -p "$PHONE_STORAGE/GodotSharp/Tools"

          # 3. Kopyahin ang .NET BCL DLLs
          echo "Copying .NET BCL assemblies..."
          find mono_extracted/ coreclr_extracted/ -name "*.dll" | while read dll_file; do
            cp "$dll_file" "$ASSETS_DIR/"
            cp "$dll_file" "$PHONE_STORAGE/assemblies/"
          done

          # 4. Kopyahin ang fresh GodotSharp at GodotPlugins DLLs
          echo "Injecting generated GodotSharp & GodotPlugins assemblies..."
          if [ -d "bin/GodotSharp" ]; then
            cp -rf bin/GodotSharp/Api/Debug/*.dll "$ASSETS_DIR/" || true
            cp -rf bin/GodotSharp/Api/Debug/*.dll "$PHONE_STORAGE/assemblies/" || true
            cp -rf bin/GodotSharp/Api/Debug/*.dll "$PHONE_STORAGE/GodotSharp/Api/Debug/" || true

            cp -rf bin/GodotSharp/Tools/* "$ASSETS_DIR/" || true
            cp -rf bin/GodotSharp/Tools/* "$PHONE_STORAGE/assemblies/" || true
            cp -rf bin/GodotSharp/Tools/* "$PHONE_STORAGE/GodotSharp/Tools/" || true
          fi

          echo "Assemblies inside assets/mono/assemblies:"
          ls -la "$ASSETS_DIR" | grep -E "Godot|System" | head -n 20

      # STEP 5: Package APK gamit ang Gradle
      - name: Package Android APK (Official Godot Gradle Task)
        run: |
          TARGET="${{ inputs.target_type || 'editor' }}"
          cd platform/android/java
          chmod +x ./gradlew

          if [ "$TARGET" = "editor" ]; then
            echo "Packaging Godot Android Editor APK..."
            ./gradlew generateGodotEditor --stacktrace
          else
            echo "Packaging Godot Android Export Template APK..."
            ./gradlew generateGodotTemplates --stacktrace
          fi

      - name: Copy & Organize Outputs
        run: |
          mkdir -p build_output/apk/
          
          # Hanapin at kopyahin ang APK
          find bin/ platform/android/java -name "*.apk" -exec cp -v {} build_output/apk/ \;
          
          # I-archive ang phone storage bundle para sa /storage/emulated/0/mono/
          cd build_output/mono_bundle
          zip -r ../mono_phone_storage.zip mono/
          cd ../..
          rm -rf build_output/mono_bundle

          echo "Nilalaman ng build_output/apk:"
          ls -la build_output/apk/

      - name: Verify Native Libs Inside Final APK
        run: |
          APK_FILE=$(find build_output/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Inspecting all native .so libraries inside $APK_FILE:"
            unzip -l "$APK_FILE" | grep -E "\.so$" || true
            echo "Inspecting Godot assemblies inside $APK_FILE:"
            unzip -l "$APK_FILE" | grep -E "GodotPlugins\.dll|GodotSharp\.dll" || true
          fi

      - name: Upload Godot Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-mono-apk
          path: build_output/apk/*.apk
          if-no-files-found: error

      - name: Upload Phone Mono Storage Bundle (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: mono-phone-storage
          path: build_output/mono_phone_storage.zip
          if-no-files-found: warn
